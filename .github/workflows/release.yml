name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'stacer/**'
      - 'stacer-core/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ./scripts/bootstrap-ubuntu-build.sh --deps-only

      - name: Build
        run: ./scripts/build.sh Release

      - name: Package
        run: ./scripts/package.sh all

      - name: Add Ubuntu version to package names
        working-directory: build
        run: |
          for f in stacer-*.deb stacer-*.tar.gz; do
            case "$f" in
              *.deb)    ext=deb ;;
              *.tar.gz) ext=tar.gz ;;
            esac
            mv "$f" "${f%.$ext}-ubuntu${{ matrix.ubuntu }}.$ext"
          done
          ls -lh stacer-*

      - uses: actions/upload-artifact@v4
        with:
          name: stacer-ubuntu${{ matrix.ubuntu }}
          path: |
            build/stacer-*.deb
            build/stacer-*.tar.gz

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
